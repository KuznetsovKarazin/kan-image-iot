[platformio]
default_envs = s3_case0

[env]
platform = espressif32@6.9.0
platform_packages =
  framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  tool-esptoolpy@2.40900.250804
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_unflags = -Os
build_flags =
  -O3
  -ffp-contract=off
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -Igenerated

[s3]
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L

[c3]
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L

[env:s3_case0]
extends = s3
build_flags = ${env.build_flags} -DMODEL_CASE=0 -DARDUINO_RUNNING_CORE=1

[env:c3_case0]
extends = c3
build_flags = ${env.build_flags} -DMODEL_CASE=0 -DARDUINO_RUNNING_CORE=0

[env:s3_case1]
extends = s3
build_flags = ${env.build_flags} -DMODEL_CASE=1 -DARDUINO_RUNNING_CORE=1

[env:c3_case1]
extends = c3
build_flags = ${env.build_flags} -DMODEL_CASE=1 -DARDUINO_RUNNING_CORE=0

[env:s3_case2]
extends = s3
build_flags = ${env.build_flags} -DMODEL_CASE=2 -DARDUINO_RUNNING_CORE=1

[env:c3_case2]
extends = c3
build_flags = ${env.build_flags} -DMODEL_CASE=2 -DARDUINO_RUNNING_CORE=0
